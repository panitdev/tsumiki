services:
  tsumiki:
    image: ghcr.io/panitdev/tsumiki:${TSUMIKI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set a dedicated Tsumiki database URL}
      TSUMIKI_MCP_TOKEN: ${TSUMIKI_MCP_TOKEN:?Set a generated MCP bearer token}
      TSUMIKI_BASE_URL: ${TSUMIKI_BASE_URL:-https://${TSUMIKI_HOST:-tsumiki.panit.dev}}
      MINECRAFT_CLIENT_JAR: /assets/client.jar
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # The tunnel connects to Traefik over HTTP. CF-Visitor carries the edge scheme.
      traefik.http.routers.tsumiki.rule: >-
        Host(`${TSUMIKI_HOST:-tsumiki.panit.dev}`) && HeaderRegexp(`CF-Visitor`, `"scheme"[[:space:]]*:[[:space:]]*"https"`)
      traefik.http.routers.tsumiki.entrypoints: web
      traefik.http.routers.tsumiki.priority: "20"
      traefik.http.routers.tsumiki.service: tsumiki
      traefik.http.routers.tsumiki-redirect.rule: Host(`${TSUMIKI_HOST:-tsumiki.panit.dev}`)
      traefik.http.routers.tsumiki-redirect.entrypoints: web
      traefik.http.routers.tsumiki-redirect.priority: "10"
      traefik.http.routers.tsumiki-redirect.service: noop@internal
      traefik.http.routers.tsumiki-redirect.middlewares: tsumiki-https
      traefik.http.middlewares.tsumiki-https.redirectregex.regex: ^http://[^/]+(.*)$
      traefik.http.middlewares.tsumiki-https.redirectregex.replacement: https://${TSUMIKI_HOST:-tsumiki.panit.dev}$${1}
      traefik.http.middlewares.tsumiki-https.redirectregex.permanent: "true"
      traefik.http.services.tsumiki.loadbalancer.server.port: "3000"
    ports:
      - "127.0.0.1:${TSUMIKI_PORT:-3017}:3000"
    volumes:
      - ./workspace:/data
      - ./assets/client.jar:/assets/client.jar:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks:
      - shared-internal
      - traefik

networks:
  shared-internal:
    external: true
  traefik:
    external: true
